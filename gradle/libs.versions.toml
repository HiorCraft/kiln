[versions]
kotlin = "2.4.21"
shadow = "9.6.1"
run-paper = "3.1.0"
loom = "1.19.4"
minecraft = "26.3"
paper = "26.3.build.256-stable"
fabric-loader = "0.20.1"
fabric-api = "0.164.0+26.3"
fabric-language-kotlin = "1.14.2+kotlin.2.4.21"
junit = "6.1.3"
luaj = "3.0.1"
plugin-yml = "0.9.0"
paperweight = "2.0.0-beta.24"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
fabric-language-kotlin = { module = "net.fabricmc:fabric-language-kotlin", version.ref = "fabric-language-kotlin" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
luaj-jse = { module = "org.luaj:luaj-jse", version.ref = "luaj" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# Gradle plugins as libraries (build-logic, gradle-plugin)
gradle-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
gradle-shadow = { module = "com.gradleup.shadow:shadow-gradle-plugin", version.ref = "shadow" }
gradle-plugin-yml = { module = "de.eldoria.plugin-yml.paper:de.eldoria.plugin-yml.paper.gradle.plugin", version.ref = "plugin-yml" }
gradle-run-paper = { module = "xyz.jpenilla.run-paper:xyz.jpenilla.run-paper.gradle.plugin", version.ref = "run-paper" }
gradle-paperweight = { module = "io.papermc.paperweight.userdev:io.papermc.paperweight.userdev.gradle.plugin", version.ref = "paperweight" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }
run-velocity = { id = "xyz.jpenilla.run-velocity", version.ref = "run-paper" }
loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }
