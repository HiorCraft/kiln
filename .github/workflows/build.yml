name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --no-daemon
      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: kiln-jars
          path: |
            server/runtime/build/libs/kiln-server-*.jar
            client/build/libs/kiln-client-*.jar
            example/server/build/libs/kiln-example-server-*.jar
          if-no-files-found: error
