name: KilnExample
version: "${version}"
main: dev.kiln.example.server.ExamplePlugin
api-version: "26.3"
depend: [Kiln]
description: Demo plugin for the kiln server API (factory GUI, keybinds, Lua extensions, market)
commands:
  pbdemo:
    description: Opens the kiln factory demo GUI
    usage: /pbdemo [open|close|status]
  shop:
    description: Opens the market (Lua extension shop with ui_kit)
    usage: /shop [markt|verkaufen|angebote|balance]
  shopdsl:
    description: Opens the same market rendered by the server (screen DSL)
    usage: /shopdsl [balance]
  fabrik:
    description: Fabrik-Steuerzentrale (Lua extension fabrik, key B)
    usage: /fabrik
  quests:
    description: Quest-Log (Lua extension questlog, key U)
    usage: /quests [open|test]
  warps:
    description: Warp menu (Lua extension warps, key V)
    usage: /warps
  bestenliste:
    description: Leaderboard (Lua extension bestenliste, key N)
    usage: /bestenliste
  profil:
    description: Settings and profile (Lua extension profil, key M)
    usage: /profil
